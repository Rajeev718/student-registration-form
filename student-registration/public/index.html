<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Rajeev Kumar" />
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" />
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="phone">Mobile Number</label>
        <input type="tel" id="phone" name="phone" maxlength="10" placeholder="9876543210" />
        <small class="error"></small>
      </div>

      <div class="field">
        <label>Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" /> Male</label>
          <label><input type="radio" name="gender" value="Female" /> Female</label>
          <label><input type="radio" name="gender" value="Other" /> Other</label>
        </div>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <select id="course" name="course">
          <option value="">-- Select Course --</option>
          <option>Web Development</option>
          <option>Python Programming</option>
          <option>Data Science</option>
          <option>Java</option>
        </select>
        <small class="error"></small>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Full address"></textarea>
        <small class="error"></small>
      </div>

      <button type="submit">Register</button>
      <p id="message"></p>
    </form>

    <h2>Registered Students</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Course</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="studentList"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
